name: Publish NuGet
on: workflow_dispatch

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Lets NuGet/login exchange a GitHub OIDC token for a temporary API key (Trusted Publishing).
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test -c Release --no-restore --no-build --verbosity normal

    - name: Package
      run: dotnet pack -c Release -o bin SimplePrompt/SimplePrompt.csproj
    # The temporary API key is valid for one hour, so request it right before pushing.
    - name: NuGet login (OIDC -> temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the email address.
    - name: Publish
      run: dotnet nuget push bin/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
