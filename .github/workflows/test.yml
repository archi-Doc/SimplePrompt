name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal

  native-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          rid: win-x64
          executable: AotSmokeTest.exe
        - os: ubuntu-latest
          rid: linux-x64
          executable: AotSmokeTest
        - os: macos-latest
          rid: osx-arm64
          executable: AotSmokeTest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install Linux native toolchain
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish NativeAOT and analyze all library code
      run: dotnet publish AotSmokeTest/AotSmokeTest.csproj -c Release -r ${{ matrix.rid }} -o artifacts/aot -warnaserror
    - name: Run NativeAOT smoke test
      run: ./artifacts/aot/${{ matrix.executable }}
    - name: Test Unix terminal input and redirected output
      if: runner.os != 'Windows'
      run: python3 AotSmokeTest/terminal_test.py artifacts/aot/${{ matrix.executable }}
